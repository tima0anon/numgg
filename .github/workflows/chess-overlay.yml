name: Chess Overlay APK
on:
  push:
    branches: [chess-overlay-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source
        run: tar -xzf chess-overlay-src.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK and include Stockfish
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChessOverlay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
