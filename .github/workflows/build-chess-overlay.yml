name: Build Chess Overlay Android APK
on:
  push:
    branches:
      - chess-overlay-android-apk
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          cat chess-overlay/source.part* | base64 -d > /tmp/chess-overlay-source.tar.xz
          echo "0d683c5252b6e74f738c663c61d0c74bead77d51774d0847d00bcb2a7cb1b29e  /tmp/chess-overlay-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/chess-overlay-source.tar.xz -C android
      - name: Apply mobile board detection and capture fix
        run: |
          cp chess-overlay/patch/BoardLocator.java android/app/src/main/java/com/chessoverlay/mobile/
          cp chess-overlay/patch/CalibrationView.java android/app/src/main/java/com/chessoverlay/mobile/
          python3 chess-overlay/patch/fix_capture.py
          sha256sum android/app/src/main/java/com/chessoverlay/mobile/OverlayService.java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
