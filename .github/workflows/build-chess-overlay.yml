name: Build Chess Overlay Android APK
on:
  push:
    branches:
      - chess-overlay-android-apk
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          cat chess-overlay/source.part* | base64 -d > /tmp/chess-overlay-source.tar.xz
          echo "0d683c5252b6e74f738c663c61d0c74bead77d51774d0847d00bcb2a7cb1b29e  /tmp/chess-overlay-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/chess-overlay-source.tar.xz -C android
      - name: Apply mobile board detection and capture fix
        run: |
          cp chess-overlay/patch/BoardLocator.java android/app/src/main/java/com/chessoverlay/mobile/
          cp chess-overlay/patch/CalibrationView.java android/app/src/main/java/com/chessoverlay/mobile/
          python3 chess-overlay/patch/fix_capture.py
          sha256sum android/app/src/main/java/com/chessoverlay/mobile/OverlayService.java
      - name: Apply automatic two-button accessibility build
        shell: bash
        run: |
          set -euo pipefail
          cat chess-overlay/auto-v03/source.part* | base64 -d > /tmp/chess-auto-patch.tar.xz
          echo "117c7b609ea053ea731b58521de8945481e15c94b536c08def288627be510517  /tmp/chess-auto-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/chess-auto-patch.tar.xz -C android
          rm -f android/app/src/main/java/com/chessoverlay/mobile/OverlayService.java
          rm -f android/app/src/main/java/com/chessoverlay/mobile/CalibrationView.java
      - name: Apply move list reader update
        shell: bash
        run: |
          set -euo pipefail
          base64 -d chess-overlay/auto-v04/delta.b64 > /tmp/chess-auto-v04.tar.xz
          echo "6f9fc7930cdc0f756668ec085950f1c94bf9f2679a4549b633d000491c301e5c  /tmp/chess-auto-v04.tar.xz" | sha256sum -c -
          mkdir -p /tmp/chess-auto-v04
          tar -xJf /tmp/chess-auto-v04.tar.xz -C /tmp/chess-auto-v04
          (cd android && patch -p1 < /tmp/chess-auto-v04/changes.patch)
          cp /tmp/chess-auto-v04/app/src/main/java/com/chessoverlay/mobile/ChessMoveReader.java android/app/src/main/java/com/chessoverlay/mobile/
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
