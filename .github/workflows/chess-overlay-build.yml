name: Chess Overlay Android Build
on:
  push:
    branches: [chess-overlay-build]
    paths:
      - chess-overlay-build/**
      - .github/workflows/chess-overlay-build.yml
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract app source and apply recognition fix
        shell: bash
        run: |
          mkdir -p chess-overlay-build/workdir
          base64 --decode chess-overlay-build/source.tar.gz.b64 | tar -xz -C chess-overlay-build/workdir
          patch -d chess-overlay-build/workdir -p1 < chess-overlay-build/board-detection-fix.patch
      - name: Compile APK with embedded Stockfish
        working-directory: chess-overlay-build/workdir
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessOverlay-v011-debug-apk
          path: chess-overlay-build/workdir/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
