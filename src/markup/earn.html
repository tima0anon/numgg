<section class="page" id="page-earn">
  <div class="group">
    <div class="group-header">🧮 Математический заработок</div>
    <div class="earn-area">
      <div class="earn-info">Реши пример и получи <b id="earnReward">3 000 ₽</b>. Это карманные деньги: лёгкий пример не оплачивает крутку.<br>Ранг <b id="earnRank">Новичок</b> усложняет примеры и режет выплату: у легенды лёгкий пример даёт около 500 ₽.</div>
      <div class="earn-level" id="earnLevel">
        <button type="button" data-level="0" class="active">Легко · ×1</button>
        <button type="button" data-level="1">Обычно · ×2</button>
        <button type="button" data-level="2">Сложно · ×4</button>
        <button type="button" data-level="3">Жёстко · ×8</button>
      </div>
      <div class="earn-problem" id="earnProblem">Загрузка...</div>
      <div class="earn-input-row">
        <input type="text" id="earnInput" placeholder="Ответ" inputmode="numeric" autocomplete="off">
        <button class="ios-btn" id="earnSubmit">Ответить</button>
      </div>
      <div class="earn-feedback" id="earnFeedback"></div>
      <button class="ios-btn gray" id="earnSkip">Пропустить пример</button>
      <div class="earn-stats">
        <div>✅ Решено <b id="earnSolved">0</b></div>
        <div>❌ Ошибок <b id="earnWrong">0</b></div>
        <div>🔥 Серия <b id="earnStreak">0</b></div>
        <div>🏆 Рекорд <b id="earnBest">0</b></div>
      </div>
    </div>
  </div>
</section>
