<section class="page" id="page-rank">
  <div class="group">
    <div class="rank-hero">
      <div class="rank-kicker">Топ 100 по максимальному балансу</div>
      <div class="rank-place" id="rankPlace">—</div>
      <div class="rank-sub" id="rankSub">Общий рейтинг всех, кто играл</div>
    </div>
    <div class="rank-list" id="rankList"></div>
  </div>
  <div class="group">
    <div class="group-header">Аккаунт</div>
    <div class="rank-form" id="rankGuest">
      <p class="rank-hint">Игра открывается только после входа. Этот же ник стоит в топе и на передаче номера.</p>
      <div class="auth-tabs">
        <button type="button" id="rankTabLogin" class="active">Вход</button>
        <button type="button" id="rankTabReg">Регистрация</button>
      </div>
      <label>Ник<input id="rankNick" maxlength="16" autocomplete="username"></label>
      <label>Пароль<input id="rankPass" type="password" maxlength="72" autocomplete="current-password"></label>
      <button type="button" class="ios-btn" id="rankAuth">Войти</button>
      <p class="auth-error" id="rankAuthError"></p>
    </div>
    <div class="rank-form" id="rankUser" hidden>
      <p class="rank-hint" id="rankAccount"></p>
      <button type="button" class="ios-btn" id="rankInbox">Забрать номера</button>
      <button type="button" class="ios-btn gray" id="rankLogout">Выйти</button>
    </div>
  </div>
</section>
