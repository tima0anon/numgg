<section class="page" id="page-rank">

    <div class="group-header">Рейтинг</div>
    <div class="rank-hero">
      <div class="rank-kicker">Топ 100 по максимальному балансу</div>
      <div class="rank-place" id="rankPlace">—</div>
      <div class="rank-sub" id="rankSub">Войди, и здесь появится твоё место</div>
      <p class="rank-account" id="rankAccount"></p>
      <div class="rank-actions">
        <button type="button" class="ios-btn" id="rankInbox">Забрать номера</button>

      <p class="rank-hint">Передать номер можно с карточки в гараже. Получатель забирает его здесь.</p>
