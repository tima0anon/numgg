<section class="page" id="page-exchange">
  <div class="group">
    <div class="ex-head">
      <div>
        <h2>Биржа</h2>
        <p class="ex-lead">Цены крутятся вокруг рынка: чаще чуть дороже или чуть дешевле, изредка скидка до 70% или наценка до 90%. Заказ платит тем больше, чем точнее маска. Покупка не чаще одной в 2 секунды. Половина доски обновляется раз в минуту.</p>
      </div>
      <div class="session-pill" title="До обновления всей доски"><span class="dot"></span>ещё <span id="sessionCountdown">60.0с</span></div>
    </div>
    <div class="ex-tabs">
      <button class="ex-tab active" data-extab="offers">Купить <span class="cnt" id="cntOffers">0</span></button>
      <button class="ex-tab" data-extab="orders">Заказы <span class="cnt" id="cntOrders">0</span></button>
      <button class="ex-tab" data-extab="my">Мои <span class="cnt" id="cntMy">0</span></button>
    </div>
    <div class="ex-content active" id="excontent-offers">
      <div class="ex-filters">
        <select id="exOfferCountry"><option value="all">Все страны</option></select>
        <select id="exOfferRarity">
          <option value="all">Все редкости</option>
          <option value="common">Мусор</option><option value="uncommon">Необычный</option><option value="rare">Редкий</option><option value="epic">Эпический</option><option value="legendary">Легендарный</option><option value="mythic">Мифический</option><option value="divine">Божественный</option>
        </select>
        <input type="text" id="exOfferSearch" placeholder="Поиск..." style="flex:1;min-width:100px">
        <button class="ios-btn gray" id="exOfferReset" style="padding:8px 14px;font-size:.8rem">Сброс</button>
      </div>
      <div class="ex-grid" id="exOfferGrid"></div>
    </div>
    <div class="ex-content" id="excontent-orders">
      <div class="ex-filters">
        <select id="exOrderCountry"><option value="all">Все страны</option></select>
          <button class="ios-btn gray" id="exOrderReset" style="padding:8px 14px;font-size:.8rem">Сброс</button>
      </div>
      <div class="ex-grid" id="exOrderGrid"></div>
    </div>
      <div class="ex-content" id="excontent-my">
        <div class="ex-filters">
          <button class="ios-btn gray" id="unlistAll" type="button" style="padding:8px 14px;font-size:.8rem">Снять все лоты</button>
        </div>
        <div class="ex-grid" id="exMyGrid"></div>
    </div>
  </div>
</section>
